<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVIA - HR Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-dark {
            background-color: #111827;
            background-image: linear-gradient(to top right, #0d121c, #111827);
        }
    </style>
</head>
<body class="bg-gradient-dark text-gray-300">
    <div class="min-h-screen flex flex-col">
        <!-- Header Navigation -->
        <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-10">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex-shrink-0">
                        <div class="flex items-center space-x-2">
                            <a href="welcome.html">
                                <img src="ChatGPT_Image_Aug_7__2025__01_22_37_PM-removebg-preview.png" alt="Solvia Logo"
                                    class="h-32 w-auto" />
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="logout-button" class="p-2 rounded-full hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-indigo-500" aria-label="Logout">
                            <svg class="h-6 w-6 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow flex items-center justify-center">
            <h1 class="text-4xl font-bold text-white">Welcome, HR!</h1>
        </main>
    </div>

    <script>
        document.getElementById('logout-button').addEventListener('click', () => {
            window.location.href = 'welcome.html';
        });
    </script>
</body>
</html>

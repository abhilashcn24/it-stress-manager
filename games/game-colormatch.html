<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVIA - Color Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-dark {
            background-color: #111827;
            background-image: linear-gradient(to top right, #0d121c, #111827);
        }
        /* Card Flip Animation Styles */
        .card {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card .front, .card .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .front {
            background-color: #374151;
            border: 2px solid #4b5563;
        }
        .card .back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gradient-dark text-gray-300">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-20">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <a href="games-home.html" class="flex items-center space-x-2 text-white font-bold hover:text-indigo-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                        </svg>
                        <span>End Session</span>
                    </a>
                    <div class="text-xl font-bold text-white">Color Match</div>
                </div>
            </div>
        </header>

        <!-- Game Content -->
        <main class="flex-grow flex flex-col items-center justify-center text-center p-4">
            <div class="bg-gray-800/50 rounded-xl shadow-lg p-8 border border-gray-700">
                <h2 class="text-3xl font-bold text-white mb-2">Find the Matching Pairs</h2>
                <p id="matchStatus" class="mb-6 text-gray-400">Moves: <span id="moves-count">0</span></p>
                
                <div id="colorMatchGrid" class="grid grid-cols-4 gap-4 mx-auto w-max mb-6">
                    <!-- Cards will be generated by JavaScript -->
                </div>
                
                <div id="completion-message" class="hidden text-center mb-6">
                    <p class="text-xl text-green-400 font-bold">Congratulations! You found them all!</p>
                </div>

                <button id="resetMatchGame" class="bg-teal-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-teal-500 transition-colors">
                    Reset Game
                </button>
            </div>
        </main>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const colorMatchGrid = document.getElementById('colorMatchGrid');
            const movesCountSpan = document.getElementById('moves-count');
            const completionMessage = document.getElementById('completion-message');
            const resetMatchGameBtn = document.getElementById('resetMatchGame');

            let flippedCards = [];
            let matchedPairs = 0;
            let moves = 0;
            let lockBoard = false; // Prevents clicking more than two cards at a time

            const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6'];
            
            function initColorMatchGame() {
                // Reset all variables
                colorMatchGrid.innerHTML = '';
                flippedCards = [];
                matchedPairs = 0;
                moves = 0;
                lockBoard = false;
                movesCountSpan.textContent = moves;
                completionMessage.classList.add('hidden');

                // Create and shuffle cards
                const gameColors = [...colors, ...colors];
                gameColors.sort(() => 0.5 - Math.random());

                gameColors.forEach(color => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card');
                    cardElement.dataset.color = color;
                    cardElement.innerHTML = `
                        <div class="front"></div>
                        <div class="back" style="background-color: ${color};"></div>
                    `;
                    cardElement.addEventListener('click', flipCard);
                    colorMatchGrid.appendChild(cardElement);
                });
            }

            function flipCard() {
                if (lockBoard) return;
                if (this === flippedCards[0]) return; // Prevent double clicking the same card

                this.classList.add('flipped');
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    lockBoard = true;
                    moves++;
                    movesCountSpan.textContent = moves;
                    checkForMatch();
                }
            }

            function checkForMatch() {
                const [card1, card2] = flippedCards;
                const isMatch = card1.dataset.color === card2.dataset.color;

                isMatch ? disableCards() : unflipCards();
            }

            function disableCards() {
                flippedCards[0].removeEventListener('click', flipCard);
                flippedCards[1].removeEventListener('click', flipCard);
                matchedPairs++;
                
                resetBoard();

                if (matchedPairs === colors.length) {
                    completionMessage.classList.remove('hidden');
                }
            }

            function unflipCards() {
                setTimeout(() => {
                    flippedCards[0].classList.remove('flipped');
                    flippedCards[1].classList.remove('flipped');
                    resetBoard();
                }, 1200);
            }

            function resetBoard() {
                [flippedCards, lockBoard] = [[], false];
            }
            
            resetMatchGameBtn.addEventListener('click', initColorMatchGame);

            // Initial start of the game
            initColorMatchGame();
        });
    </script>

</body>
</html>

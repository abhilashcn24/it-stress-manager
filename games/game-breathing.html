<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVIA - Breathing Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-dark {
            background-color: #111827;
            background-image: linear-gradient(to top right, #0d121c, #111827);
        }
        
        .tracer-circle {
            stroke-dasharray: 565; /* Circumference of a 90 radius circle (2 * pi * 90) */
            stroke-dashoffset: 565;
            animation-name: trace;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes trace {
            0% {
                stroke-dashoffset: 565; /* Starts empty */
            }
            50% {
                stroke-dashoffset: 0; /* Fills up (breathe in) */
            }
            100% {
                stroke-dashoffset: 565; /* Empties (breathe out) */
            }
        }
    </style>
</head>
<body class="bg-gradient-dark text-gray-300">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-20">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <a id="backButton" href="games-home.html" class="flex items-center space-x-2 text-white font-bold hover:text-indigo-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                        </svg>
                        <span>Back to Games</span>
                    </a>
                    <div class="flex items-center space-x-4">
                        <div class="text-xl font-bold text-white">Breathing Guide</div>
                        <button id="muteBtn" class="bg-gray-700 text-white text-sm font-bold py-2 px-4 rounded-lg hover:bg-gray-600 transition-colors">Mute</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Game Content -->
        <main class="flex-grow flex flex-col items-center justify-center text-center p-4">
            
            <!-- Game Container -->
            <div id="gameContainer">
                <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
                    <svg class="absolute w-full h-full" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" fill="none" stroke="#374151" stroke-width="4" stroke-dasharray="4 12" />
                        <circle id="tracerCircle" class="tracer-circle" cx="100" cy="100" r="90" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" transform="rotate(-90 100 100)" />
                    </svg>
                    <div class="relative text-white text-2xl md:text-3xl font-bold">
                        <span id="breathing-text">Breathe In...</span>
                        <div id="breath-counter" class="text-sm text-gray-400 mt-2">Breath 1 / 10</div>
                    </div>
                </div>
                <p class="mt-12 text-gray-400 max-w-sm">
                    Follow the tracer around the circle. Inhale as it appears, and exhale as it disappears.
                </p>
            </div>

            <!-- Completion Screen -->
            <div id="completionScreen" class="hidden text-center">
                <h2 class="text-4xl font-bold text-white mb-4">Session Complete</h2>
                <p class="text-gray-400 mb-8">You've completed 10 mindful breaths. Well done.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button id="restartBtn" class="bg-teal-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-teal-500 transition-colors">Restart</button>
                    <a href="games-home.html" class="bg-gray-700 text-white font-bold py-3 px-8 rounded-lg hover:bg-gray-600 transition-colors">End Session</a>
                </div>
            </div>

        </main>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const breathingText = document.getElementById('breathing-text');
            const tracerCircle = document.getElementById('tracerCircle');
            const breathCounterText = document.getElementById('breath-counter');
            const gameContainer = document.getElementById('gameContainer');
            const completionScreen = document.getElementById('completionScreen');
            const restartBtn = document.getElementById('restartBtn');
            const muteBtn = document.getElementById('muteBtn');
            const backButton = document.getElementById('backButton');

            let breathCount = 1;
            const animationDuration = 20; 

            // --- Audio Variables ---
            let audioCtx = null;
            let oscillator = null;
            let gainNode = null;
            let isMuted = false;

            // --- Audio Functions ---
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                // Browsers require a user gesture to start audio. We'll resume it here.
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playOmSound() {
                if (isMuted || oscillator) return;
                initAudio();
                
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(136.1, audioCtx.currentTime); // "Om" frequency
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1); // Fade in gently

                oscillator.start();
            }

            function stopOmSound() {
                if (oscillator && gainNode) {
                    // Stop sound immediately without fadeout for a cleaner exit
                    oscillator.stop(0);
                    oscillator = null;
                }
            }

            function toggleMute() {
                // On the first click of mute, initialize audio context
                initAudio();
                isMuted = !isMuted;
                muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
                if (isMuted) {
                    stopOmSound();
                } else {
                    if (!gameContainer.classList.contains('hidden')) {
                        playOmSound();
                    }
                }
            }

            // --- Game Logic ---
            function updateBreathingText() {
                setTimeout(() => {
                    breathingText.innerText = 'Breathe Out...';
                }, animationDuration * 1000 / 2); // Halfway through
            }

            function startGame() {
                breathCount = 1;
                gameContainer.classList.remove('hidden');
                completionScreen.classList.add('hidden');
                breathingText.innerText = 'Breathe In...';
                breathCounterText.innerText = `Breath ${breathCount} / 10`;
                tracerCircle.style.animationDuration = `${animationDuration}s`;
                tracerCircle.style.animationPlayState = 'running';
                
                updateBreathingText();
                playOmSound();
            }

            tracerCircle.addEventListener('animationiteration', () => {
                breathCount++;
                if (breathCount <= 10) {
                    breathingText.innerText = 'Breathe In...';
                    breathCounterText.innerText = `Breath ${breathCount} / 10`;
                    updateBreathingText();
                } else {
                    tracerCircle.style.animationPlayState = 'paused';
                    gameContainer.classList.add('hidden');
                    completionScreen.classList.remove('hidden');
                    stopOmSound();
                }
            });

            restartBtn.addEventListener('click', startGame);
            muteBtn.addEventListener('click', toggleMute);
            
            // Ensure sound stops when navigating away
            backButton.addEventListener('click', stopOmSound);
            window.addEventListener('pagehide', stopOmSound); // Robust cleanup

            // Initial start of the game
            startGame();
        });
    </script>

</body>
</html>

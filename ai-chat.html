<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLVIA - AI Wellness Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-dark {
            background-color: #111827;
            background-image: linear-gradient(to top right, #0d121c, #111827);
        }
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-track {
            background: #1f2937;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 20px;
        }
        /* Modal Styles */
        .modal-hidden { display: none; }
        .modal-show { transform: scale(1); opacity: 1; }
        .modal-content { transition: transform 0.3s ease, opacity 0.3s ease; transform: scale(0.95); opacity: 0; }
    </style>
</head>
<body class="bg-gradient-dark text-gray-300">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-10">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <a href="dashboard.html" class="flex items-center space-x-2 text-white font-bold hover:text-indigo-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                        </svg>
                        <span>Back to Dashboard</span>
                    </a>
                    <div class="text-xl font-bold text-white">AI Wellness Chat</div>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="flex-grow flex flex-col container mx-auto p-4 max-w-3xl">
            <div id="chat-window" class="flex-grow p-6 bg-gray-800/50 rounded-t-xl overflow-y-auto border-x border-t border-gray-700">
                <!-- Messages will be appended here -->
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-gray-800/50 rounded-b-xl border-x border-b border-gray-700">
                <div class="flex items-center gap-4">
                    <input type="text" id="user-input" placeholder="Type your message here..." class="flex-grow bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white" autocomplete="off">
                    <button id="mic-button" class="p-3 bg-gray-700 rounded-full hover:bg-gray-600 transition-colors">
                        <svg class="w-6 h-6 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                    </button>
                    <button id="send-button" class="bg-indigo-600 text-white font-bold py-3 px-5 rounded-lg hover:bg-indigo-500 transition-colors">
                        Send
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- "Coming Soon" Modal for Mic Button -->
    <div id="coming-soon-modal" class="modal-hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="modal-content bg-gray-800 text-white rounded-lg shadow-xl p-8 w-full max-w-sm relative text-center">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white">&times;</button>
            <h2 class="text-2xl font-bold mb-4">Feature Coming Soon!</h2>
            <p class="text-gray-400">Voice input is currently under development. Please use the text input for now.</p>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const micButton = document.getElementById('mic-button');
        const modal = document.getElementById('coming-soon-modal');
        const closeModal = document.getElementById('close-modal');

        // ---- Conversation memory ----
        let memory = JSON.parse(localStorage.getItem("chatMemory")) || [];

        const quotes = [
            { "content": "The best way to predict the future is to create it.", "author": "Peter Drucker" },
            { "content": "The only way to do great work is to love what you do.", "author": "Steve Jobs" },
            { "content": "Believe you can and you're halfway there.", "author": "Theodore Roosevelt" },
            { "content": "Success is not final, failure is not fatal: it is the courage to continue that counts.", "author": "Winston Churchill" },
            { "content": "The mind is everything. What you think you become.", "author": "Buddha" }
        ];

        function getWelcomeMessage() {
            if (memory.length === 0) { // Only show welcome message for new chats
                const randomIndex = Math.floor(Math.random() * quotes.length);
                const randomQuote = quotes[randomIndex];
                const welcomeText = `Welcome! Here is a thought for the day: "${randomQuote.content}" - ${randomQuote.author}`;
                appendMessage('bot', welcomeText);
                memory.push({ sender: "bot", text: welcomeText });
                localStorage.setItem("chatMemory", JSON.stringify(memory));
            }
        }

        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (userMessage === '') return;

            appendMessage('user', userMessage);
            memory.push({ sender: "user", text: userMessage });

            // keep only last 20 messages (10 user-bot pairs)
            if (memory.length > 20) memory = memory.slice(-20);

            userInput.value = '';

            try {
                // IMPORTANT: Replace with your n8n webhook URL
                const response = await fetch('YOUR_N8N_WEBHOOK_URL_HERE', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userMessage,
                        conversation: memory // send memory to backend
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const result = await response.json();
                // Assumes your n8n workflow returns a 'text' field
                const botReply = result.text || "I'm not sure how to respond to that.";
                appendMessage('bot', botReply);

                memory.push({ sender: "bot", text: botReply });
                if (memory.length > 20) memory = memory.slice(-20);

                localStorage.setItem("chatMemory", JSON.stringify(memory));

            } catch (error) {
                console.error("Error fetching bot response:", error);
                appendMessage('bot', 'I am currently unable to respond. Please try again later.');
            }
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-4');

            let formattedMessage = message.replace(/\n/g, '<br>');

            const senderName = sender === 'user' ? 'You' : 'Solvia AI';
            const senderColor = sender === 'user' ? 'text-indigo-400' : 'text-teal-400';

            messageElement.innerHTML = `
                <div class="font-bold ${senderColor}">
                    ${senderName}
                </div>
                <div class="text-white">${formattedMessage}</div>
            `;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // ---- Restore previous chat history ----
        memory.forEach(m => appendMessage(m.sender, m.text));

        // Modal functionality for mic button
        micButton.addEventListener('click', () => {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('div').classList.add('modal-show');
            }, 10);
        });

        function closeModalFunction() {
            modal.querySelector('div').classList.remove('modal-show');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        closeModal.addEventListener('click', closeModalFunction);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModalFunction();
        });

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', getWelcomeMessage);
    </script>
</body>
</html>

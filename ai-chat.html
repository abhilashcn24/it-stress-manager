<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOLVIA - AI Wellness Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-gradient-dark {
            background-color: #111827;
            background-image: linear-gradient(to top right, #0d121c, #111827);
        }

        .modal-show {
            transform: scale(1) !important;
            opacity: 1 !important;
        }

        /* Voice agent loader lines inside mic button */
        .mic-loader {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 24px;
            /* height inside button */
            width: 32px;
        }

        .mic-loader .line {
            width: 4px;
            background: #1d2228;
            border-radius: 2px;
            animation: moveUpDown 1s infinite ease-in-out;
            transform-origin: bottom;
        }

        .mic-loader .line:nth-child(1) {
            height: 8px;
            animation-delay: 0s;
        }

        .mic-loader .line:nth-child(2) {
            height: 14px;
            animation-delay: 0.2s;
        }

        .mic-loader .line:nth-child(3) {
            height: 20px;
            animation-delay: 0.4s;
        }

        .mic-loader .line:nth-child(4) {
            height: 16px;
            animation-delay: 0.6s;
        }

        @keyframes moveUpDown {

            0%,
            100% {
                transform: scaleY(1);
                opacity: 0.7;
            }

            50% {
                transform: scaleY(1.5);
                opacity: 1;
            }
        }

        /* Set all buttons same height inside #chat-input */
        #chat-input button {
            height: 48px;
            min-width: 48px;
            padding: 0;
        }

        /* Adjust send button padding + image size for vertical center */
        #send-button {
            padding: 0 16px;
        }

        #send-button img {
            height: 24px;
            width: 24px;
        }

        /* Voice Agent Styles */
        .voice-agent-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        #voiceCanvas {
            border-radius: 50%;
            box-shadow:
                0 0 50px rgba(255, 255, 255, 0.1),
                inset 0 0 50px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .status {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        .listening-indicator {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .listening-indicator.active {
            opacity: 1;
            animation: pulse 1.5s infinite;
        }

        .mute-button {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .mute-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .mute-button.muted {
            background: rgba(244, 67, 54, 0.2);
            border-color: rgba(244, 67, 54, 0.6);
        }

        .mute-button.muted:hover {
            background: rgba(244, 67, 54, 0.3);
        }

        .mute-icon {
            width: 24px;
            height: 24px;
            stroke: rgba(255, 255, 255, 0.8);
            transition: stroke 0.3s ease;
        }

        .mute-button.muted .mute-icon {
            stroke: rgba(244, 67, 54, 0.9);
        }

        .mute-button.muted .mute-line {
            display: block !important;
        }

        @keyframes pulse {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                opacity: 0.7;
            }

            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gradient-dark text-gray-300">

    <div class="min-h-screen flex flex-col">
        <!-- Header Navigation -->
        <header class="bg-gray-900/80 backdrop-blur-sm shadow-lg sticky top-0 z-10">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex-shrink-0">
                        <div class="flex items-center space-x-2">
                            <a href="dashboard.html">
                                <img src="ChatGPT_Image_Aug_7__2025__01_22_37_PM-removebg-preview.png" alt="Solvia Logo"
                                    class="h-32 w-auto" />
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="dashboard.html"
                            class="p-2 rounded-full hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-indigo-500"
                            aria-label="Dashboard">
                            <svg class="h-6 w-6 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.25 12l8.954-8.955a.75.75 0 011.06 0l8.955 8.955M3 11.25V21a.75.75 0 00.75.75h5.25a.75.75 0 00.75-.75v-6a.75.75 0 01.75-.75h3a.75.75 0 01.75.75v6a.75.75 0 00.75.75h5.25a.75.75 0 00.75-.75V11.25m-18 0A23.96 23.96 0 0112 3c2.33 0 4.555.336 6.75 1.25" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">
            <div id="chat-container"
                class="bg-gray-800/50 rounded-xl shadow-lg p-6 flex-grow flex flex-col border border-gray-700">
                <div id="chat-window" class="flex-grow mb-4 overflow-y-auto">
                    <!-- Chat messages will be appended here -->
                </div>
                <div id="chat-input" class="flex items-center space-x-4">
                    <input type="text" id="user-input"
                        class="flex-grow bg-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Type your message..." />
                    <button id="send-button"
                        class="bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-colors duration-200 flex items-center justify-center">
                        <img src="sent1.png" alt="Send" />
                    </button>
                    <button id="mic-button"
                        class="bg-white text-gray-700 font-bold rounded-lg hover:bg-gray-200 transition-colors duration-200 flex items-center justify-center shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] active:shadow-[inset_0_1px_2px_rgba(0,0,0,0.6)] p-3"
                        aria-label="Voice agent loading animation">
                        <div class="mic-loader" role="img" aria-live="polite" aria-atomic="true">
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                    </button>

                    <!-- Voice Agent Modal -->
                    <div id="voice-agent-modal"
                        class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden">
                        <div class="voice-agent-container">
                            <div class="listening-indicator" id="listeningIndicator"></div>
                            <button class="mute-button" id="muteButton" title="Toggle microphone">
                                <svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                    <line x1="12" y1="19" x2="12" y2="23"></line>
                                    <line x1="8" y1="23" x2="16" y2="23"></line>
                                    <line x1="4" y1="4" x2="20" y2="20" class="mute-line" style="display:none; stroke: red; stroke-width: 2;" />
                                </svg>
                            </button>
                            <canvas id="voiceCanvas" width="600" height="600"></canvas>
                            <div class="status" id="status">Initializing voice agent...</div>
                            <button id="close-modal" class="absolute top-4 right-4 text-white text-2xl font-bold">×</button>
                        </div>
                    </div>
                    <a href="quiz.html" id="quiz-button"
                        class="bg-teal-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-teal-700 transition-colors duration-200">Quiz
                        Buzz</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const micButton = document.getElementById('mic-button');
        const modal = document.getElementById('voice-agent-modal');
        const closeModal = document.getElementById('close-modal');
        let voiceAgent;

        const quotes = [
            {
                "content": "The best way to predict the future is to create it.",
                "author": "Peter Drucker"
            },
            {
                "content": "The only way to do great work is to love what you do.",
                "author": "Steve Jobs"
            },
            {
                "content": "Believe you can and you're halfway there.",
                "author": "Theodore Roosevelt"
            },
            {
                "content": "Success is not final, failure is not fatal: it is the courage to continue that counts.",
                "author": "Winston Churchill"
            },
            {
                "content": "The mind is everything. What you think you become.",
                "author": "Buddha"
            }
        ];

        function getWelcomeMessage() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const randomQuote = quotes[randomIndex];
            appendMessage('bot', `Welcome! Here is a thought for the day: "${randomQuote.content}" - ${randomQuote.author}`);
        }

        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (userMessage === '') return;

            appendMessage('user', userMessage);
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();
                appendMessage('bot', result.message);

            } catch (error) {
                console.error("Error fetching bot response:", error);
                appendMessage('bot', 'I am currently unable to respond. Please try again later.');
            }
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('mb-4');

            let formattedMessage = message;
            if (sender === 'bot') {
                formattedMessage = formattedMessage.replace(/\n/g, '<br>');
            }

            messageElement.innerHTML = `
                <div class="font-bold ${sender === 'user' ? 'text-indigo-400' : 'text-green-400'}">${sender === 'user' ? 'You' : 'Solvia AI'}</div>
                <div class="text-white">${formattedMessage}</div>
            `;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Modal functionality for mic button
        micButton.addEventListener('click', () => {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('.voice-agent-container').classList.add('modal-show');
                if (!voiceAgent) {
                    voiceAgent = new AIVoiceAgent();
                }
            }, 10);
        });

        closeModal.addEventListener('click', closeModalFunction);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModalFunction();
        });

        function closeModalFunction() {
            modal.querySelector('.voice-agent-container').classList.remove('modal-show');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (voiceAgent) {
                    voiceAgent.destroy();
                    voiceAgent = null;
                }
            }, 300);
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.addEventListener('DOMContentLoaded', getWelcomeMessage);

        class AIVoiceAgent {
            constructor() {
                this.canvas = document.getElementById('voiceCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.status = document.getElementById('status');
                this.indicator = document.getElementById('listeningIndicator');

                this.width = 600;
                this.height = 600;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                this.center = { x: this.width / 2, y: this.height / 2 };
                this.baseRadius = this.width * 0.35;
                this.currentRadius = this.baseRadius;
                this.targetRadius = this.baseRadius;

                this.particles = [];
                this.numParticles = 800;
                this.audioLevel = 0;
                this.smoothedAudioLevel = 0;
                this.isListening = false;

                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.silenceThreshold = 30;
                this.voiceThreshold = 50;
                this.silenceTimer = 0;
                this.maxSilenceTime = 60;
                this.isMuted = false;
                this.mediaStream = null;
                this.animationFrameId = null;

                this.init();
            }

            init() {
                this.createParticles();
                this.setupAudio();
                this.setupMuteButton();
                this.animate();
            }

            createParticles() {
                for (let i = 0; i < this.numParticles; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * this.baseRadius * 0.8;
                    const x = this.center.x + Math.cos(angle) * distance;
                    const y = this.center.y + Math.sin(angle) * distance;

                    this.particles.push({
                        x: x,
                        y: y,
                        baseX: x,
                        baseY: y,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        size: Math.random() * 1.5 + 0.5,
                        alpha: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2,
                        frequency: Math.random() * 0.02 + 0.01
                    });
                }
            }

            async setupAudio() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });

                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    const source = this.audioContext.createMediaStreamSource(this.mediaStream);

                    source.connect(this.analyser);
                    this.analyser.fftSize = 512;
                    this.analyser.smoothingTimeConstant = 0.8;

                    const bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(bufferLength);

                    this.status.textContent = 'Voice agent ready - Start speaking';

                } catch (err) {
                    console.error('Microphone access denied:', err);
                    this.status.textContent = 'Microphone access required';
                }
            }

            setupMuteButton() {
                const muteButton = document.getElementById('muteButton');

                muteButton.addEventListener('click', () => {
                    this.toggleMute();
                });
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                const muteButton = document.getElementById('muteButton');
                const muteLine = muteButton.querySelector('.mute-line');

                if (this.isMuted) {
                    // Mute the microphone
                    if (this.mediaStream) {
                        this.mediaStream.getAudioTracks().forEach(track => {
                            track.enabled = false;
                        });
                    }
                    muteButton.classList.add('muted');
                    muteLine.style.display = 'block';
                    this.status.textContent = 'Microphone muted';
                    this.isListening = false;
                    this.indicator.classList.remove('active');
                } else {
                    // Unmute the microphone
                    if (this.mediaStream) {
                        this.mediaStream.getAudioTracks().forEach(track => {
                            track.enabled = true;
                        });
                    }
                    muteButton.classList.remove('muted');
                    muteLine.style.display = 'none';
                    this.status.textContent = 'Voice agent ready - Start speaking';
                }
            }

            analyzeAudio() {
                if (!this.analyser || this.isMuted) {
                    this.audioLevel = 0;
                    this.isListening = false;
                    this.indicator.classList.remove('active');
                    return;
                }

                this.analyser.getByteFrequencyData(this.dataArray);

                let speechSum = 0;
                const speechStart = Math.floor(85 / (this.audioContext.sampleRate / 2) * this.dataArray.length);
                const speechEnd = Math.floor(8000 / (this.audioContext.sampleRate / 2) * this.dataArray.length);

                for (let i = speechStart; i < speechEnd && i < this.dataArray.length; i++) {
                    speechSum += this.dataArray[i];
                }

                this.audioLevel = speechSum / (speechEnd - speechStart);

                if (this.audioLevel > this.voiceThreshold) {
                    this.isListening = true;
                    this.silenceTimer = 0;
                    this.indicator.classList.add('active');
                    if (!this.isMuted) {
                        this.status.textContent = 'Listening...';
                    }
                } else if (this.audioLevel < this.silenceThreshold) {
                    this.silenceTimer++;
                    if (this.silenceTimer > this.maxSilenceTime) {
                        this.isListening = false;
                        this.indicator.classList.remove('active');
                        if (!this.isMuted) {
                            this.status.textContent = 'Voice agent ready - Start speaking';
                        }
                    }
                }

                const targetLevel = this.isListening ? this.audioLevel / 255 : 0;
                this.smoothedAudioLevel += (targetLevel - this.smoothedAudioLevel) * 0.15;
                this.targetRadius = this.baseRadius + (this.smoothedAudioLevel * 80);
            }

            updateParticles() {
                const currentTime = Date.now() * 0.001;
                this.currentRadius += (this.targetRadius - this.currentRadius) * 0.1;

                for (let i = 0; i < this.particles.length; i++) {
                    const particle = this.particles[i];

                    particle.x += particle.vx;
                    particle.y += particle.vy;

                    if (this.isListening && !this.isMuted) {
                        const waveAmplitude = this.smoothedAudioLevel * 15;
                        const wave = Math.sin(currentTime * 3 + particle.phase) * waveAmplitude;
                        const distFromCenter = Math.sqrt(
                            (particle.x - this.center.x) ** 2 +
                            (particle.y - this.center.y) ** 2
                        );

                        if (distFromCenter > 0) {
                            const normalX = (particle.x - this.center.x) / distFromCenter;
                            const normalY = (particle.y - this.center.y) / distFromCenter;
                            particle.x += normalX * wave;
                            particle.y += normalY * wave;
                        }
                    }

                    const dx = particle.x - this.center.x;
                    const dy = particle.y - this.center.y;
                    const distanceFromCenter = Math.sqrt(dx * dx + dy * dy);

                    if (distanceFromCenter > this.currentRadius) {
                        const angle = Math.atan2(dy, dx);
                        particle.x = this.center.x + Math.cos(angle) * (this.currentRadius - 2);
                        particle.y = this.center.y + Math.sin(angle) * (this.currentRadius - 2);

                        const normalX = dx / distanceFromCenter;
                        const normalY = dy / distanceFromCenter;
                        const dotProduct = particle.vx * normalX + particle.vy * normalY;
                        particle.vx -= 2 * dotProduct * normalX;
                        particle.vy -= 2 * dotProduct * normalY;

                        particle.vx += (Math.random() - 0.5) * 0.1;
                        particle.vy += (Math.random() - 0.5) * 0.1;
                    }

                    if (Math.abs(particle.vx) < 0.1) particle.vx += (Math.random() - 0.5) * 0.2;
                    if (Math.abs(particle.vy) < 0.1) particle.vy += (Math.random() - 0.5) * 0.2;

                    const maxVelocity = 2;
                    const velocity = Math.sqrt(particle.vx ** 2 + particle.vy ** 2);
                    if (velocity > maxVelocity) {
                        particle.vx = (particle.vx / velocity) * maxVelocity;
                        particle.vy = (particle.vy / velocity) * maxVelocity;
                    }

                    const targetAlpha = (this.isListening && !this.isMuted) ?
                        0.7 + this.smoothedAudioLevel * 0.3 :
                        0.4 + Math.sin(currentTime + particle.phase) * 0.2;
                    particle.alpha += (targetAlpha - particle.alpha) * 0.1;
                }
            }

            draw() {
                this.ctx.fillStyle = 'rgba(15, 22, 34, 0.08)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                if (this.isListening && !this.isMuted && this.smoothedAudioLevel > 0.1) {
                    this.ctx.beginPath();
                    this.ctx.arc(this.center.x, this.center.y, this.currentRadius, 0, Math.PI * 2);
                    this.ctx.strokeStyle = `rgba(255, 255, 255, ${this.smoothedAudioLevel * 0.3})`;
                    this.ctx.lineWidth = 1;
                    this.ctx.stroke();
                }

                for (const particle of this.particles) {
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${particle.alpha})`;
                    this.ctx.fill();

                    if (this.isListening && !this.isMuted) {
                        this.ctx.shadowBlur = 8;
                        this.ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                        this.ctx.fill();
                        this.ctx.shadowBlur = 0;
                    }
                }
            }

            animate() {
                this.analyzeAudio();
                this.updateParticles();
                this.draw();
                this.animationFrameId = requestAnimationFrame(() => this.animate());
            }

            destroy() {
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                }
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
            }
        }
    </script>
</body>

</html>

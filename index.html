<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Solvia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            transition: transform 0.6s ease-in-out, opacity 0.5s ease-in-out;
        }
        .overlay-container {
            transition: transform 0.6s ease-in-out;
        }
        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
            opacity: 0;
        }
        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 101; /* Ensured sign-up is on top */
            animation: show 0.6s;
        }
        .form-container.sign-in-container { /* Added for sign-in form z-index */
            z-index: 100;
        }
        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
            z-index: 1; /* Decreased z-index */
        }
        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }
        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }
        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }
        .social-container a {
            border: 1px solid #4b5563;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            transition: background-color 0.2s;
        }
        .social-container a:hover {
            background-color: #4b5563;
        }
        /* Style for the video inside the overlay */
        .overlay-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.5);
        }
        @keyframes show {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen">

    <div id="container" class="container bg-gray-800 rounded-lg shadow-2xl relative overflow-hidden w-full max-w-4xl min-h-[550px]">
        
        <!-- Sign Up Form -->
        <div class="form-container sign-up-container absolute top-0 left-0 h-full w-1/2 opacity-0 z-10">
            <form id="signUpForm" class="bg-gray-800 flex items-center justify-center flex-col px-12 h-full text-center">
                <h1 class="text-3xl font-bold text-white mb-4">Create Account</h1>
                <div class="social-container mb-4">
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.525 12.016c0-.853-.073-1.685-.216-2.49H12.22v4.71h5.79c-.248 1.52-1.003 2.81-2.296 3.656v3.056h3.912c2.288-2.108 3.6-5.242 3.6-8.932z"/><path d="M12.22 22.4c3.246 0 5.952-1.07 7.936-2.9l-3.91-3.055c-1.07.718-2.44 1.14-4.025 1.14-3.09 0-5.71-2.08-6.64-4.88H1.513v3.15C3.475 20.078 7.53 22.4 12.22 22.4z"/><path d="M5.58 14.71c-.22-.67-.34-1.37-.34-2.09s.12-1.42.34-2.09V7.37H1.514C.727 8.95.32 10.63.32 12.4s.406 3.45.994 4.94l4.266-3.63z"/><path d="M12.22 5.4c1.75 0 3.33.606 4.58 1.8l3.47-3.46C18.17 1.95 15.46 0 12.22 0 7.53 0 3.47 2.32 1.51 5.84l4.07 3.15c.93-2.8 3.55-4.88 6.64-4.88z"/></svg></a>
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.67.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98-3.56-.18-6.72-1.89-8.83-4.48-.37.63-.58 1.37-.58 2.15 0 1.49.76 2.8 1.9 3.57-.7-.02-1.37-.22-1.95-.55v.05c0 2.08 1.48 3.82 3.44 4.21-.36.1-.74.15-1.14.15-.28 0-.55-.03-.81-.08.55 1.7 2.14 2.94 4.03 2.97-1.47 1.15-3.33 1.84-5.35 1.84-.35 0-.69-.02-1.03-.06 1.9 1.22 4.16 1.93 6.56 1.93 7.88 0 12.2-6.54 12.2-12.2 0-.19 0-.37-.01-.56.83-.6 1.56-1.36 2.14-2.23z"/></svg></a>
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
                </div>
                <span class="text-sm text-gray-400 mb-4">or use your email for registration</span>
                <input type="text" placeholder="Name" id="signUpName" class="bg-gray-700 border-none p-3 my-2 w-full text-white rounded" />
                <input type="email" placeholder="Email" id="signUpEmail" class="bg-gray-700 border-none p-3 my-2 w-full text-white rounded" />
                <input type="password" placeholder="Password" id="signUpPassword" class="bg-gray-700 border-none p-3 my-2 w-full text-white rounded" />
                <button type="submit" class="rounded-full bg-teal-600 text-white text-sm font-bold py-3 px-12 uppercase tracking-wider mt-4">Sign Up</button>
            </form>
        </div>

        <!-- Sign In Form -->
        <div class="form-container sign-in-container absolute top-0 left-0 h-full w-1/2 z-20">
            <form id="signInForm" class="bg-gray-800 flex items-center justify-center flex-col px-12 h-full text-center">
                <h1 class="text-3xl font-bold text-white mb-4">Sign in</h1>
                <div class="social-container mb-4">
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.525 12.016c0-.853-.073-1.685-.216-2.49H12.22v4.71h5.79c-.248 1.52-1.003 2.81-2.296 3.656v3.056h3.912c2.288-2.108 3.6-5.242 3.6-8.932z"/><path d="M12.22 22.4c3.246 0 5.952-1.07 7.936-2.9l-3.91-3.055c-1.07.718-2.44 1.14-4.025 1.14-3.09 0-5.71-2.08-6.64-4.88H1.513v3.15C3.475 20.078 7.53 22.4 12.22 22.4z"/><path d="M5.58 14.71c-.22-.67-.34-1.37-.34-2.09s.12-1.42.34-2.09V7.37H1.514C.727 8.95.32 10.63.32 12.4s.406 3.45.994 4.94l4.266-3.63z"/><path d="M12.22 5.4c1.75 0 3.33.606 4.58 1.8l3.47-3.46C18.17 1.95 15.46 0 12.22 0 7.53 0 3.47 2.32 1.51 5.84l4.07 3.15c.93-2.8 3.55-4.88 6.64-4.88z"/></svg></a>
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.67.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98-3.56-.18-6.72-1.89-8.83-4.48-.37.63-.58 1.37-.58 2.15 0 1.49.76 2.8 1.9 3.57-.7-.02-1.37-.22-1.95-.55v.05c0 2.08 1.48 3.82 3.44 4.21-.36.1-.74.15-1.14.15-.28 0-.55-.03-.81-.08.55 1.7 2.14 2.94 4.03 2.97-1.47 1.15-3.33 1.84-5.35 1.84-.35 0-.69-.02-1.03-.06 1.9 1.22 4.16 1.93 6.56 1.93 7.88 0 12.2-6.54 12.2-12.2 0-.19 0-.37-.01-.56.83-.6 1.56-1.36 2.14-2.23z"/></svg></a>
                    <a href="#" class="text-gray-300"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
                </div>
                <span class="text-sm text-gray-400 mb-4">or use your account</span>
                <input type="email" placeholder="Email" id="signInEmail" class="bg-gray-700 border-none p-3 my-2 w-full text-white rounded" />
                <input type="password" placeholder="Password" id="signInPassword" class="bg-gray-700 border-none p-3 my-2 w-full text-white rounded" />
                <a href="#" class="text-sm text-gray-400 my-4">Forgot your password?</a>
                <button type="submit" class="rounded-full bg-teal-600 text-white text-sm font-bold py-3 px-12 uppercase tracking-wider">Sign In</button>
            </form>
        </div>

        <!-- Overlay Panels -->
        <div class="overlay-container absolute top-0 left-1/2 w-1/2 h-full overflow-hidden z-50">
            <div class="overlay relative -left-full h-full w-[200%]">
                
                <video autoplay loop muted playsinline class="overlay-video">
                    <source src="Amazing Bird View [Vidéo] _ Bateaux Coiffures avec bandeau Mounir.mp4" type="video/mp4">
                </video>

                <div class="overlay-panel overlay-left absolute flex items-center justify-center flex-col px-10 text-center top-0 h-full w-1/2 transform -translate-x-[20%]">
                    <div class="bg-black/40 backdrop-blur-md p-8 rounded-lg">
                        <h2 class="text-3xl font-bold text-center mb-6 text-white">Welcome Back</h2>
                        <p class="text-base font-light leading-tight mb-6 text-white">To keep connected with us please login with your personal info</p>
                        <button id="signIn" class="rounded-full border border-white text-white text-sm font-bold py-3 px-12 uppercase tracking-wider">Sign In</button>
                    </div>
                </div>
                <div class="overlay-panel overlay-right absolute flex items-center justify-center flex-col px-10 text-center top-0 right-0 h-full w-1/2 transform translate-x-0">
                    <div class="bg-black/40 backdrop-blur-md p-8 rounded-lg">
                        <h1 class="text-3xl font-bold text-white mb-4">Hello, Friend!</h1>
                        <p class="text-base font-light leading-tight mb-6 text-white">Enter your personal details and start your journey with us</p>
                        <button id="signUp" class="rounded-full border border-white text-white text-sm font-bold py-3 px-12 uppercase tracking-wider">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });
    </script>

</body>
</html>
